<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Enquiry - CounselScope</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .form-box { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 520px; box-sizing: border-box; border: 1px solid #e2e8f0; }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { max-width: 140px; height: auto; }
        h2 { margin-top: 0; color: #0f172a; text-align: center; margin-bottom: 5px; font-size: 21px; font-weight: 700; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 22px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; box-sizing: border-box; background: #fff; color: #334155; }
        input:focus, select:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #0369a1; }
        #examExtraFields { display: none; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 5px; }
        #thankYouMessage { display: none; text-align: center; padding: 20px 0; }
        #thankYouMessage h3 { color: #16a34a; font-size: 24px; margin-bottom: 10px; }
        #thankYouMessage p { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

    <div class="form-box">
        <div id="formContainer">
            <div class="logo-container">
                <img src="https://i.ibb.co/6R6t2Y0/unnamed.jpg" alt="CounselScope Logo">
            </div>
            <h2>Admission Enquiry Form</h2>
            <div class="subtitle">From Counselling to Campus, We Are With You</div>
            
            <form id="leadForm">
                <div class="input-group">
                    <label>Student Name *</label>
                    <input type="text" id="student_name" name="student_name" required placeholder="Enter student full name">
                </div>
                <div class="input-group">
                    <label>Father's Name</label>
                    <input type="text" id="father_name" name="father_name" placeholder="Enter father's name">
                </div>
                <div class="input-group">
                    <label>Contact Number *</label>
                    <input type="tel" id="contact_number" name="contact_number" required placeholder="10-digit mobile number">
                </div>
                <div class="input-group">
                    <label>Alternate Contact Number</label>
                    <input type="tel" id="alternate_number" name="alternate_number" placeholder="Alternate phone number">
                </div>
                <div class="input-group">
                    <label>Student Email ID *</label>
                    <input type="email" id="student_email" name="student_email" required placeholder="student@example.com">
                </div>

                <!-- NEW FIELD: Current Education Level -->
                <div class="input-group">
                    <label>Current Education Level *</label>
                    <select id="current_education" name="current_education" required>
                        <option value="">Select Education Level</option>
                        <option value="Class 10">Class 10</option>
                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                        <option value="Graduation">Graduation</option>
                        <option value="Post Graduation">Post Graduation</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- NEW FIELD: Entrance Exam & Score / Upload (PDF/Image) -->
                <div class="input-group">
                    <label>Entrance Exam (if taken)</label>
                    <select id="exam_name" name="exam_name" onchange="toggleExamFields()">
                        <option value="None">None / Not Applicable</option>
                        <option value="JEE Main">JEE Main</option>
                        <option value="NEET">NEET</option>
                        <option value="CUET">CUET</option>
                        <option value="CAT">CAT</option>
                        <option value="Other Exam">Other Exam</option>
                    </select>
                </div>

                <div id="examExtraFields" class="input-group">
                    <label>Exam Score / Rank</label>
                    <input type="text" id="exam_score" name="exam_score" placeholder="Enter Score / Percentile / Rank">
                    <label style="margin-top: 10px;">Upload Scorecard / Document (PDF or Image only)</label>
                    <input type="file" id="exam_file" name="exam_file" accept=".pdf, .jpg, .jpeg, .png">
                </div>

                <!-- NEW FIELD: Caste Category -->
                <div class="input-group">
                    <label>Caste Category *</label>
                    <select id="caste_category" name="caste_category" required>
                        <option value="">Select Category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- NEW FIELD: Preferred Study Location -->
                <div class="input-group">
                    <label>Preferred Study Location / City</label>
                    <input type="text" id="preferred_location" name="preferred_location" placeholder="e.g. Bangalore, Delhi, Pune">
                </div>

                <div class="input-group">
                    <label>State *</label>
                    <select id="state" name="state" required>
                        <option value="">Select State</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Other State">Other State</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>City *</label>
                    <input type="text" id="city" name="city" required placeholder="Enter your city">
                </div>

                <button type="submit" id="submitBtn">Submit Enquiry</button>
            </form>
        </div>

        <div id="thankYouMessage">
            <div class="logo-container">
                <img src="https://i.ibb.co/6R6t2Y0/unnamed.jpg" alt="Logo" style="max-width: 120px;">
            </div>
            <h3>🎉 Thank You!</h3>
            <p>Your enquiry and documents have been received successfully. Our counselor will contact you shortly.</p>
        </div>
    </div>

    <script>
        function toggleExamFields() {
            const val = document.getElementById('exam_name').value;
            document.getElementById('examExtraFields').style.display = (val !== 'None') ? 'block' : 'none';
        }

        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('student_name', document.getElementById('student_name').value);
            formData.append('father_name', document.getElementById('father_name').value);
            formData.append('contact_number', document.getElementById('contact_number').value);
            formData.append('alternate_number', document.getElementById('alternate_number').value);
            formData.append('student_email', document.getElementById('student_email').value);
            formData.append('current_education', document.getElementById('current_education').value);
            formData.append('exam_name', document.getElementById('exam_name').value);
            formData.append('exam_score', document.getElementById('exam_score').value);
            formData.append('caste_category', document.getElementById('caste_category').value);
            formData.append('preferred_location', document.getElementById('preferred_location').value);
            formData.append('state', document.getElementById('state').value);
            formData.append('city', document.getElementById('city').value);

            const fileInput = document.getElementById('exam_file');
            if(fileInput.files.length > 0) {
                formData.append('exam_file', fileInput.files[0]);
            }

            try {
                // Apna Render URL yahan daalein
                const response = await fetch('https://counselscope-crm.onrender.com/api/submit-lead', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('thankYouMessage').style.display = 'block';
                } else {
                    alert('Error: ' + result.message);
                    btn.innerText = "Submit Enquiry";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
                btn.innerText = "Submit Enquiry";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
