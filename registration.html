<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Enquiry Form</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #0f172a; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #0369a1; }
        #thankYouMessage { display: none; text-align: center; }
        #thankYouMessage h3 { color: #16a34a; font-size: 24px; margin-bottom: 10px; }
        #thankYouMessage p { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

    <div class="form-box">
        <div id="formContainer">
            <h2>🎓 College Admission Inquiry</h2>
            <form id="leadForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" name="name" required placeholder=" Apna naam likhein">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="9876543210">
                </div>
                <button type="submit" id="submitBtn">Submit Enquiry</button>
            </form>
        </div>

        <div id="thankYouMessage">
            <h3>🎉 Thank You!</h3>
            <p>Aapki enquiry mil gayi hai. Hamara counselor jald hi aapse contact karega.</p>
        </div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('phone', document.getElementById('phone').value);

            try {
                // Yahan apna Render wala live URL daalna hai (jaise: https://college-lead-crm.onrender.com/api/submit-lead)
                const response = await fetch('https://counselscope-crm.onrender.com/api/submit-lead', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('thankYouMessage').style.display = 'block';
                } else {
                    alert('Error: ' + result.message);
                    btn.innerText = "Submit Enquiry";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Kuch gadbad ho gayi, dubara try karo.');
                btn.innerText = "Submit Enquiry";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
