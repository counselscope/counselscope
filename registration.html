<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Enquiry - CounselScope</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .form-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 480px; box-sizing: border-box; border: 1px solid #e2e8f0; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 160px; height: auto; }
        h2 { margin-top: 0; color: #0f172a; text-align: center; margin-bottom: 8px; font-size: 22px; font-weight: 700; }
        .subtitle { text-align: center; color: #64748b; font-size: 13.5px; margin-bottom: 25px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fff; transition: 0.2s; color: #334155; }
        input:focus, select:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #0369a1; }
        #thankYouMessage { display: none; text-align: center; padding: 20px 0; }
        #thankYouMessage h3 { color: #16a34a; font-size: 26px; margin-bottom: 12px; }
        #thankYouMessage p { color: #64748b; font-size: 14.5px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="form-box">
        <div id="formContainer">
            <div class="logo-container">
                <img src="logo.png" alt="CounselScope Logo">
            </div>
            <h2>Admission Enquiry Form</h2>
            <div class="subtitle">From Counselling to Campus, We Are With You</div>
            
            <form id="leadForm">
                <div class="input-group">
                    <label>Student Name *</label>
                    <input type="text" id="student_name" name="student_name" required placeholder="Enter student full name">
                </div>
                <div class="input-group">
                    <label>Father's Name</label>
                    <input type="text" id="father_name" name="father_name" placeholder="Enter father's name">
                </div>
                <div class="input-group">
                    <label>Contact Number *</label>
                    <input type="tel" id="contact_number" name="contact_number" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
                </div>
                <div class="input-group">
                    <label>Alternate Contact Number</label>
                    <input type="tel" id="alternate_number" name="alternate_number" placeholder="Alternate phone number">
                </div>
                <div class="input-group">
                    <label>Student Email ID *</label>
                    <input type="email" id="student_email" name="student_email" required placeholder="student@example.com">
                </div>
                <!-- Added Current Education Level field here -->
                <div class="input-group">
                    <label>Current Education Level *</label>
                    <input type="text" id="current_education_level" name="current_education_level" required placeholder="e.g. 12th Pass, Graduate, etc.">
                </div>
                <div class="input-group">
                    <label>State *</label>
                    <select id="state" name="state" required>
                        <option value="">Select State</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Delhi">Delhi</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>City *</label>
                    <input type="text" id="city" name="city" required placeholder="Enter your city">
                </div>
                <div class="input-group">
                    <label>[Redacted ID] Document / Card (Image/PDF) *</label>
                    <input type="file" id="id_document" name="id_document" accept="image/*,.pdf" required style="padding: 9px;">
                </div>
                <button type="submit" id="submitBtn">Submit Enquiry</button>
            </form>
        </div>

        <div id="thankYouMessage">
            <div class="logo-container">
                <img src="logo.png" alt="CounselScope Logo" style="max-width: 130px;">
            </div>
            <h3>🎉 Thank You!</h3>
            <p>Your enquiry and documents have been successfully submitted. Our expert counselor will contact you shortly.</p>
        </div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting with Document...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('student_name', document.getElementById('student_name').value);
            formData.append('father_name', document.getElementById('father_name').value);
            formData.append('contact_number', document.getElementById('contact_number').value);
            formData.append('alternate_number', document.getElementById('alternate_number').value);
            formData.append('student_email', document.getElementById('student_email').value);
            formData.append('current_education_level', document.getElementById('current_education_level').value);
            formData.append('state', document.getElementById('state').value);
            formData.append('city', document.getElementById('city').value);
            
            const fileField = document.getElementById('id_document');
            if (fileField.files.length > 0) {
                formData.append('id_document', fileField.files[0]);
            }

            try {
                const response = await fetch('https://counselscope-crm.onrender.com/api/submit-lead', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('thankYouMessage').style.display = 'block';
                } else {
                    alert('Error: ' + result.message);
                    btn.innerText = "Submit Enquiry";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
                btn.innerText = "Submit Enquiry";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
