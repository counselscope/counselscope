<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Counselling & Admission Form - CounselScope</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 750px; border: 1px solid #e2e8f0; }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header img { max-width: 100px; border-radius: 8px; margin-bottom: 15px; }
        .form-header h2 { color: #0f172a; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .form-header p { color: #64748b; font-size: 14px; }
        .status-banner { padding: 12px 18px; border-radius: 10px; margin-bottom: 25px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .status-granted { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-denied { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; color: #1e293b; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button.submit-btn { width: 100%; padding: 14px; background: #2563eb; border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button.submit-btn:hover { background: #1d4ed8; }
        @media(max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .form-container { padding: 20px; } }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <img src="https://i.ibb.co/6R6t2Y0/unnamed.jpg" alt="Logo">
            <h2>Student Counselling & Admission Form</h2>
            <p>Fill out your details for expert academic guidance and admission assistance.</p>
        </div>

        <div id="authStatusBanner" class="status-banner status-denied">
            <i class="fa-solid fa-lock"></i> <span id="bannerText">Checking Editing Access...</span>
        </div>

        <form id="studentRegistrationForm" onsubmit="submitStudentForm(event)">
            <input type="hidden" id="lead_id" name="lead_id">
            
            <div class="grid-2">
                <div class="form-group">
                    <label>Student Full Name *</label>
                    <input type="text" id="student_name" name="student_name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text" id="father_name" name="father_name" placeholder="Enter father's name">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Contact Number *</label>
                    <input type="text" id="contact_number" name="contact_number" required placeholder="10-digit mobile number">
                </div>
                <div class="form-group">
                    <label>Student Email ID *</label>
                    <input type="email" id="student_email" name="student_email" required placeholder="name@example.com">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Current Education Level</label>
                    <select id="current_education" name="current_education">
                        <option value="12th Appearing/Passed">12th Appearing/Passed</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Post Graduate">Post Graduate</option>
                        <option value="Diploma">Diploma</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Course Interest</label>
                    <input type="text" id="course_interest" name="course_interest" placeholder="e.g. B.Tech, MBA, MBBS">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" name="state" placeholder="State">
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" name="city" placeholder="City">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Approximate Budget</label>
                    <input type="text" id="budget" name="budget" placeholder="e.g. 5 Lakhs - 10 Lakhs">
                </div>
                <div class="form-group">
                    <label>Entrance Exam & Score</label>
                    <input type="text" id="exam_score" name="exam_score" placeholder="e.g. JEE/NEET Score">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Aadhar Document</label>
                    <input type="file" name="aadhar_file">
                </div>
                <div class="form-group">
                    <label>12th Marksheet</label>
                    <input type="file" name="class12_file">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Application</button>
        </form>
    </div>

    <script>
        async function checkStudentAccess() {
            try {
                const res = await fetch('/api/student-auth-status');
                const data = await res.json();
                const banner = document.getElementById('authStatusBanner');
                const bannerText = document.getElementById('bannerText');
                
                if(data.authorized && data.lead) {
                    banner.className = "status-banner status-granted";
                    bannerText.innerHTML = "Editing Access Granted! You can update your submitted details below.";
                    
                    const l = data.lead;
                    document.getElementById('lead_id').value = l.id;
                    document.getElementById('student_name').value = l.student_name || '';
                    document.getElementById('father_name').value = l.father_name || '';
                    document.getElementById('contact_number').value = l.contact_number || '';
                    document.getElementById('student_email').value = l.student_email || '';
                    document.getElementById('current_education').value = l.current_education || '';
                    document.getElementById('course_interest').value = l.course_interest || '';
                    document.getElementById('state').value = l.state || '';
                    document.getElementById('city').value = l.city || '';
                    document.getElementById('budget').value = l.budget || '';
                    document.getElementById('exam_score').value = l.exam_score || '';
                    document.getElementById('submitBtn').innerText = "Update My Application";
                } else {
                    banner.className = "status-banner status-denied";
                    bannerText.innerHTML = data.message || "Editing Access Not Available. You can submit a new enquiry.";
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function submitStudentForm(e) {
            e.preventDefault();
            const formEl = document.getElementById('studentRegistrationForm');
            const formData = new FormData(formEl);

            const res = await fetch('/api/submit-lead', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            if(res.ok) {
                alert(result.message || "Successfully submitted!");
                location.reload();
            } else {
                alert("Error: " + (result.message || "Failed to submit"));
            }
        }

        checkStudentAccess();
    </script>
</body>
</html>
